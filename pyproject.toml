[project]
name = "linux-ai-helper"
version = "0.1.0"
description = "A lightweight native Linux desktop GUI assistant (GTK4 / libadwaita)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=0.1.0",
    "keyring>=24.0.0",
    "openai>=1.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "config*", "executor*", "ui*"]



[tool.setuptools.package-data]
ui = ["style.css", "icons/hicolor/scalable/actions/*.svg"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
