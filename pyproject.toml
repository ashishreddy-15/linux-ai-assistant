[project]
name = "linux-ai-helper"
version = "0.1.0"
description = "A lightweight native Linux desktop GUI assistant"
readme = "AGENTS.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.5.0",
    "google-genai>=0.1.0",
    "keyring>=24.0.0",
    "openai>=1.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
