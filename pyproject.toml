[project]
name = "linux-ai-helper"
version = "0.1.0"
description = "A lightweight native Linux desktop GUI assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=0.1.0",
    "keyring>=24.0.0",
    "openai>=1.0.0",
    "pywebview>=6.2.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "config*", "executor*", "ui*"]


